# Standard CI for a fleet repo. The gates run in the shared workflow, and
# `ci-success` here is the one required status check on main, so adding or
# renaming a gate never touches the ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    # The hub runs the workflow from the same commit, so a change to it is
    # proven on its own pull request. A job-level call resolves when the run
    # starts, never from the runner's files, and actionlint cannot read the
    # $/ form yet.
    uses: ./.github/workflows/fleet-ci.yml # zizmor: ignore[self-repository]
    with:
      profile: code
      shell: true
  # Compares each marketplace entry with the plugin.json in its repository.
  # It reads GitHub, so it runs here and never under bun test.
  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:sources
  ci-success:
    if: ${{ !cancelled() }}
    needs: [checks, marketplace]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
