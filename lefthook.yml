# Mirrors the CI format and lint gates on the staged files. Type checks and
# tests run in CI behind ci-success. Installed by `bun install` through the
# lefthook package's postinstall. Never bypass with --no-verify.
# `bun run` starts the tools from node_modules, at the versions bun.lock
# pins, under Bun, so no Node install is needed. A missing `bun install`
# fails the hook instead of fetching a release.
min_version: 2.1.9
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: fix:ts
      group:
        piped: true
        jobs:
          - name: fix:ts-lint
            run: bun run oxlint --type-aware --deny-warnings --fix {staged_files}
            glob: "**/*.{ts,mts}"
            stage_fixed: true
          - name: fix:ts-format
            run: bun run oxfmt --write {staged_files}
            glob: "**/*.{ts,mts}"
            stage_fixed: true
    - name: fix:config
      run: bun run oxfmt --write {staged_files}
      glob: "**/*.{json,jsonc,yml,yaml,toml}"
      stage_fixed: true
    # markdownlint reads the file oxfmt wrote, so the two run in order.
    # --no-globs keeps markdownlint to the staged files.
    - name: docs
      group:
        piped: true
        jobs:
          - name: fix:docs
            run: bun run oxfmt --write {staged_files}
            glob: "**/*.{md,mdx}"
            stage_fixed: true
          - name: check:docs
            run: bun run markdownlint-cli2 --no-globs {staged_files}
            glob: "**/*.{md,mdx}"
